[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hrms-ai-service"
version = "0.1.0"
description = "Permission-aware HR policy assistant (RAG) for the HRMS platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "numpy>=2.0",
    "anthropic>=2.12,<3",
    "fastembed>=0.9,<1",   # local embedding models on ONNX Runtime (no PyTorch, no GPU needed)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",   # used by FastAPI's TestClient
    "ruff>=0.8",
    "testcontainers>=4.8",   # real Postgres + pgvector in Docker for integration tests
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs Docker (Testcontainers); skipped automatically if Docker isn't running",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, B: bug-prone patterns, UP: modern syntax,
# S: security (bandit rules), SIM: simplifications
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is how pytest works
