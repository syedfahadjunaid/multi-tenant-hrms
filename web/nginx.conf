# Serves the built single-page app and forwards everything dynamic to the BFF, so the browser
# only ever talks to one origin. The core API and the AI service are not reachable from the
# browser at all: the BFF calls the core API with the user's access token, which never
# reaches the browser.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers. "always" also adds them to error responses.
    # CSP: scripts and styles only from this origin (no inline code), API calls only to this
    # origin (Keycloak is only ever navigated to, never fetched), and the app can't be framed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Used by every proxied location below (they inherit these because they set none).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The BFF: API calls, the start of sign-in, Keycloak's redirect back, and sign-out.
    location /api/ {
        proxy_pass http://bff:8080;
        client_max_body_size 1m;
        proxy_read_timeout 90s;   # LLM answers can take a while
    }
    location /oauth2/ {
        proxy_pass http://bff:8080;
    }
    location /login/oauth2/ {
        proxy_pass http://bff:8080;
    }
    location = /logout {
        proxy_pass http://bff:8080;
    }

    # Built files have content hashes in their names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Anything else is a client-side route: serve index.html, and never cache it,
    # so users always get the latest build.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
