# Local development stack.
#
#   docker compose up -d                    -> infrastructure only (run the services from your IDE)
#   docker compose --profile app up -d      -> everything: infra, both services and the web app
#                                              (open http://localhost:5280)
#
# All ports are bound to 127.0.0.1 so nothing is reachable from your network.
# Secrets come from .env (copy .env.example -> .env). Nothing has a default password.

name: hrms

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?copy .env.example to .env}
      # Used once by infra/postgres/init/01-init.sh to create one login per service
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?copy .env.example to .env}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?copy .env.example to .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP, so this only passes once init scripts have finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d hrms"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?copy .env.example to .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?copy .env.example to .env}
      # Tokens always say iss=http://localhost:8180/realms/hrms, even when services
      # fetch signing keys over the internal Docker network (http://keycloak:8080).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Fills in "${BFF_CLIENT_SECRET}" in hrms-realm.json when the realm is first imported.
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?copy .env.example to .env}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The Keycloak image has no curl, so talk HTTP to the management port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?copy .env.example to .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ai-service:
    profiles: ["app"]
    build: ./services/ai-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      JWT_ISSUER_URI: http://localhost:8180/realms/hrms
      JWT_JWK_SET_URI: http://keycloak:8080/realms/hrms/protocol/openid-connect/certs
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Keyword + vector search. Off by default: it lowered accuracy on the eval set, whose
      # questions are everyday paraphrases (see README). Set to true in .env to try it.
      RETRIEVAL_HYBRID: ${RETRIEVAL_HYBRID:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  core-service:
    profiles: ["app"]
    build: ./services/core-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hrms
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ISSUER_URI: http://localhost:8180/realms/hrms
      JWT_JWK_SET_URI: http://keycloak:8080/realms/hrms/protocol/openid-connect/certs
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  # Backend-for-frontend: signs users in with Keycloak and keeps their tokens in a Redis-backed
  # session; the browser only gets an HttpOnly cookie. Forwards /api/* to core-service.
  bff:
    profiles: ["app"]
    build: ./services/bff
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?copy .env.example to .env}
      BFF_PUBLIC_URL: http://localhost:5280
      # The browser reaches Keycloak at localhost:8180; this container reaches it as keycloak:8080.
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/hrms
      KEYCLOAK_BACKCHANNEL_URI: http://keycloak:8080/realms/hrms
      CORE_SERVICE_URL: http://core-service:8080
    # Published for "npm run dev", whose Vite server forwards /api, /oauth2, /login and /logout here.
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      core-service:
        condition: service_started

  web:
    profiles: ["app"]
    build: ./web
    # Port 5280 is where the hrms-bff client's redirect URI (in Keycloak) points.
    # Stop this container (docker compose stop web) when running "npm run dev" instead.
    ports:
      - "127.0.0.1:5280:8080"
    depends_on:
      - bff

volumes:
  postgres-data:
