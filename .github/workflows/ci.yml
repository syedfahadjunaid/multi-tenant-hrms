name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-service:
    name: core-service (Java 25, Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Unit + integration tests; Testcontainers uses the runner's Docker
      - run: sh mvnw -B verify

  bff:
    name: bff (Java 25, Spring Cloud Gateway)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bff
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Full sign-in flow against a fake Keycloak, with sessions in a Testcontainers Redis
      - run: sh mvnw -B verify

  ai-service:
    name: ai-service (Python, FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest   # includes pgvector integration tests (Testcontainers uses the runner's Docker)
      - uses: actions/cache@v6
        with:
          path: services/ai-service/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      # Quality gate on the 66-document set: fail the build if retrieval gets worse
      # (bge-small ranks the right policy first for 80% of questions; see evals/retrieval)
      - run: python -m evals.retrieval.run --cache-dir .cache/fastembed --fail-under 0.75

  web:
    name: web (React, TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build   # includes the TypeScript type check

  security-scan:
    name: Security scan (dependencies, secrets, misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  docker-images:
    name: Build container images
    needs: [core-service, bff, ai-service, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t hrms/core-service:ci services/core-service
      - run: docker build -t hrms/bff:ci services/bff
      - run: docker build -t hrms/ai-service:ci services/ai-service
      - run: docker build -t hrms/web:ci web
